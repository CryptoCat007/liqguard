[menu]
text = "🏠 Main menu\n\nLiqGuard watches your perpetual futures for liquidation risk: it tells you which position to handle first, then works out the cheapest way to rescue it.\n\n{status}\n\nPick a feature:"
status_demo = "🎮 Demo mode is on (simulated data)"
status_bound = "🔗 Connected: {names}"
status_unbound = "🔌 No account connected yet. Try 🎬 Demo first."
help = """❓ Help

LiqGuard watches your perpetual futures positions, warns you before liquidation and works out the cheapest rescue. Muse (Meta, muse-spark-1.3) writes the one 💡 recommendation each screen leads with.

📊 Risk overview: overall risk, Muse's summary, handling order, stop-loss and wick flags
📋 My positions → tap a position → 🛟 Rescue sim / 🕯 Wick stress / 🛑 Stop-loss check / 💸 Funding impact
🛡 Stop-loss check: every position's stop against its liquidation price
🚨 What first: when several positions are in danger, ranks them by urgency and explains why
🧪 Stress test: the market drop that liquidates a whole cross wallet when everything falls together
💸 Funding & fees: what the next funding settlement costs and the fee to close
🤖 Ask Muse: preset questions, or /ask with your own
🔔 Alerts: alert tiers, wake-up reminder interval, quiet hours
🔑 Bind account: Binance read-only API key or Hyperliquid wallet address
🧾 Account & actions: status, testnet-only protective actions, kill switch
🖥️ Dashboard: one-time login link
🎬 Demo: try every feature with simulated positions (a short, finite run; ⏹ Stop demo ends it at any time)
🌐 Language / 語言: English or 繁體中文

On an alert: 🚑 Handle this first opens the rescue sim, ✅ I'm awake stops wake-up reminders, 😴 Snooze pauses them for 30 min.

Every command is also a button here: /menu · /risk · /positions · /ask · /demo · /settings · /bind · /status · /dashboard · /stopdemo · /lang"""

