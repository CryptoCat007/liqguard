🔑 綁定帳號：Binance 唯讀 API 金鑰或 Hyperliquid 錢包地址
🖥️ 網頁看板：一次性登入連結
🎬 Demo：用模擬倉位體驗所有功能（短暫、會自行結束；⏹ 停止 Demo 可隨時結束）
🌐 Language / 語言：English 或 繁體中文

